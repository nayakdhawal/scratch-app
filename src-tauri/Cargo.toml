[package]
name = "tauri-notes-app"
version = "0.1.0"
description = "A notes and todo app"
authors = ["you"]
license = ""
repository = ""
default-run = "tauri-notes-app"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-all", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
